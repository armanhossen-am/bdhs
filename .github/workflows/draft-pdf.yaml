# Builds the JOSS paper (paper/paper.md) with the Open Journals toolchain.
on:
  push:
    paths:
      - paper/paper.md
      - paper/paper.bib
      - .github/workflows/draft-pdf.yaml
  workflow_dispatch:

name: draft-pdf

jobs:
  paper:
    runs-on: ubuntu-latest
    name: JOSS paper draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
